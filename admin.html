<!DOCTYPE html> <html> <head> <title>AI Agency - Admin Panel</title> <link rel="stylesheet" href="/style.css"> </head> <body> <section class="admin-panel"> <h1>Admin Panel</h1> <p>Client Messages</p> <div class="admin-table"> <table> <tr> <th>ID</th> <th>Name</th> <th>Email</th> <th>Message</th> </tr> {% for message in messages %} <tr> <td>{{ message.id }}</td> <td>{{ message.name }}</td> <td>{{ message.email }}</td> <td>{{ message.message }}</td> </tr> {% endfor %} </table> </div> </section> </body> </html>
